<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Builds | Digital Systems & Automation</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <!-- Use a tech-style font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Base Styling */
        body { margin: 0; padding: 0; background-color: #030712; color: #f1f5f9; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;}

        /* Subtle "Scanline" background effect */
        body::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; z-index: 10; pointer-events: none; opacity: 0.3;}

        .container { text-align: center; max-width: 600px; padding: 40px; border-radius: 16px; border: 1px solid #1e293b; background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(56, 189, 248, 0.1); position: relative; z-index: 20; }

        /* The Animated Status Tag */
        .status { font-family: 'Share Tech Mono', monospace; color: #38bdf8; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 2px; position: relative;}
        .status::before { content: ""; display: inline-block; width: 10px; height: 10px; background-color: #38bdf8; border-radius: 50%; margin-right: 10px; animation: pulse 1.5s infinite; }

        /* Main Heading */
        h1 { font-family: 'Share Tech Mono', monospace; font-size: 3.5rem; color: white; margin: 15px 0; letter-spacing: -2px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);}

        /* Animated Typing Description */
        .description { color: #94a3b8; font-size: 1.2rem; line-height: 1.6; max-width: 450px; margin: 0 auto 30px; min-height: 3.2rem;}

        /* Focus Area Section */
        .focus-areas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px;}
        .focus-box { background: rgba(30, 41, 59, 0.5); padding: 15px; border-radius: 8px; border: 1px solid #334155;}
        .focus-box h3 { font-family: 'Share Tech Mono', monospace; color: white; font-size: 1.1rem; margin: 0 0 5px;}
        .focus-box p { color: #94a3b8; font-size: 0.9rem; margin: 0;}

        /* Contact Link */
        .contact { display: inline-block; margin-top: 40px; font-family: 'Share Tech Mono', monospace; color: #38bdf8; text-decoration: none; border: 1px solid #38bdf8; padding: 10px 20px; border-radius: 4px; transition: all 0.3s ease; }
        .contact:hover { background-color: rgba(56, 189, 248, 0.1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        /* Keyframe Animations */
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">System Status: Booting</div>
        <h1>Magic Builds</h1>
        <p class="description">Building custom web upgrades & digital systems that defy convention.</p>
        
        <div class="focus-areas">
            <div class="focus-box">
                <h3>_Automation</h3>
                <p>Faceless arbitrage & trading bot engineering.</p>
            </div>
            <div class="focus-box">
                <h3>_Develop</h3>
                <p>High-performance web agency services.</p>
            </div>
        </div>

        <a href="mailto:hello@getmagicbuilds.com" class="contact">Initialize Contact</a>
    </div>
</body>
</html>
